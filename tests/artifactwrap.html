<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui;background:#faf9f7}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body></body>
<script>
fetch('../dist/artifact.html').then(r=>r.text()).then(t=>{
  document.body.innerHTML = t.replace(/<script>[\s\S]*?<\/script>/,'');
  var m = t.match(/<script>([\s\S]*?)<\/script>/);
  var s = document.createElement('script'); s.textContent = m[1]; document.body.appendChild(s);
});
</script></html>
